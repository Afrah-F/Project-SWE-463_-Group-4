name: mizania
description: "Mizania: a bilingual (English/Arabic) student budget tracker built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Shared state (approved in Phase 2)
  provider: ^6.1.2

  # Local persistence (temporary repository layer, see README)
  shared_preferences: ^2.3.2

  # Charts on the Reports screen
  fl_chart: ^0.69.2

  # Date / number formatting and Arabic + English locale support
  intl: any

  # Unique ids for records
  uuid: ^4.5.1

  # Password hashing for the temporary local auth service
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
